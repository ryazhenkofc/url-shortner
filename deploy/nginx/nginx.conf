events { worker_connections 4096; }

http {
    upstream app {
        least_conn;
        server app1:8000 max_fails=0;
        server app2:8000 max_fails=0;
        server app3:8000 max_fails=0;
        keepalive 64;
        # max_fails=0: nginx counts read timeouts as node failures, so a busy cluster was ejected
        # whole and every request got 502. A dead node costs one 100 ms connect, then a retry.
    }

    # Internal compose networks are not rate limited (k6 needs that). Remove in prod.
    geo $internal {
        default        0;
        172.16.0.0/12  1;
        10.0.0.0/8     1;
        192.168.0.0/16 1;
    }
    map $internal $limit_ip {
        1       "";
        default $binary_remote_addr;
    }
    limit_req_zone $limit_ip            zone=redir:10m rate=50r/s;
    limit_req_zone $http_authorization  zone=api:10m   rate=20r/s;
    limit_req_status 429;

    # One Retry-After for every 429/503: nginx limit_req, uvicorn's limiter and the app's own 503
    map $status $retry_after {
        429     1;
        503     1;
        default "";
    }
    proxy_hide_header Retry-After;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;

    server {
        listen 80;
        add_header Retry-After $retry_after always;

        location = / {
            proxy_pass http://app;
        }

        location ^~ /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_connect_timeout 100ms;
            proxy_read_timeout 6s;
            proxy_next_upstream off;            # the client retries POST with an Idempotency-Key
            proxy_pass http://app;
        }

        location ^~ /health/ {
            proxy_pass http://app;
        }

        location = /metrics { return 404; }     # must precede the code regex: "metrics" has 7 chars

        location ~ "^/[A-Za-z0-9_-]{3,10}$" {
            limit_req zone=redir burst=100 nodelay;
            proxy_connect_timeout 100ms;
            proxy_read_timeout 500ms;
            proxy_next_upstream error timeout;
            proxy_next_upstream_timeout 150ms;  # retries a failed connect, never a slow read: that doubles overload
            proxy_next_upstream_tries 2;        # GET is safe to retry on another node
            proxy_pass http://app;
        }

        location / { return 404; }
    }
}
