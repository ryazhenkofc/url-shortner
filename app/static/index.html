  :root {
    --bg: #FCFCFB; --fg: #111110; --dim: #6A6A68; --faint: #8E8E8B; --line: #D9D9D6; --row: #E4E4E2; --hover: #2B2B29;
    --sans: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif;
    --mono: 'DM Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font-family: var(--sans); }
  a { color: var(--fg); text-decoration: none; }
  a:focus-visible, button:focus-visible { outline: 1px solid var(--fg); outline-offset: 4px; }
  header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 32px; padding: 12px 40px; }
  main { flex: 1 1 auto; width: 100%; max-width: 1320px; margin: 0 auto; padding: 96px 40px 120px; }
  footer { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px; padding: 12px 40px 28px; }
  .nav, .tx, .lbl, .blk { font-family: inherit; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
  .nav, .tx { display: flex; align-items: center; min-height: 44px; padding: 0; border: 0; background: none; font-weight: 500; color: var(--dim); cursor: pointer; text-align: left; }
  .nav { color: var(--fg); }
  .brand { font-size: 12px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; display: flex; align-items: center; min-height: 44px; }
  .nav:hover, .tx:hover { text-decoration: underline; text-underline-offset: 6px; color: var(--fg); }
  .tx.strong { color: var(--fg); font-weight: 600; }
  .lbl { font-size: 11px; font-weight: 500; color: var(--dim); }
  .blk { min-height: 52px; min-width: 140px; padding: 0 36px; border: 0; border-radius: 0; background: var(--fg); color: var(--bg); font-weight: 600; letter-spacing: .16em; cursor: pointer; transition: background-color .15s; }
  .blk:hover { background: var(--hover); }
  .blk:disabled { opacity: .5; cursor: not-allowed; }
  .big, .sm { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; color: var(--fg); transition: border-color .15s; }
  .big { font: 300 clamp(32px, 6vw, 88px)/1.1 var(--sans); letter-spacing: -.03em; padding: 0 0 20px; }
  .sm { font: 18px var(--mono); padding: 12px 0; }
  .big::placeholder { color: var(--faint); opacity: 1; }
  .big:focus, .sm:focus { outline: none; border-bottom-color: var(--fg); }
  .col { display: flex; flex-direction: column; }
  .wrap { display: flex; flex-wrap: wrap; align-items: center; }
  .display { font-size: clamp(32px, 6vw, 88px); font-weight: 300; line-height: 1.1; letter-spacing: -.03em; overflow-wrap: anywhere; }
  .title { margin: 0; font-size: clamp(40px, 5vw, 72px); font-weight: 300; line-height: 1.1; letter-spacing: -.03em; }
  .dim { color: var(--dim); }
  .err { margin: 24px 0 0; min-height: 22px; font-size: 14px; color: #B3261E; }
  #links { list-style: none; margin: 72px 0 0; padding: 0; border-bottom: 1px solid var(--row); }
  #links li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 40px; padding: 20px 0; border-top: 1px solid var(--row); }
  @media (min-width: 641px) { .row-actions { min-width: 232px; justify-content: flex-end; } }
  dl { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 48px 40px; max-width: 1000px; }
  dd { margin: 0; font-size: 15px; }
  .fade { animation: fade .25s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (max-width: 640px) { header, footer { padding-left: 16px; padding-right: 16px; } main { padding: 48px 16px 80px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <a class="brand" href="#/">Shrt</a>
  <a class="nav" id="nav" href="#/links">Links</a>
</header>

<main id="main" class="fade"></main>

<footer>
  <label class="lbl" for="key">API key</label>
  <input id="key" class="sm" type="password" autocomplete="off" style="width:180px;font-size:13px;padding:14px 0">
</footer>

<script>
const $ = (id) => document.getElementById(id);
let links = load('links', []);
let state = {};

function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* private mode: keep in memory only */ }
}
// randomUUID needs a secure context; plain-HTTP deployments fall back to getRandomValues
const uuid = () => crypto.randomUUID ? crypto.randomUUID()
  : ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, (c) => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const host = (l) => l.short_url.slice(0, l.short_url.lastIndexOf('/') + 1).replace(/^https?:\/\//, '');
const fmt = (iso) => new Date(iso).toLocaleString([], { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

async function api(method, path, body, extraHeaders) {
  const res = await fetch(path, {
    method,
    headers: { 'Authorization': 'Bearer ' + $('key').value, 'Content-Type': 'application/json', ...extraHeaders },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.ok) return res.status === 204 ? null : res.json();
  const retry = res.headers.get('Retry-After');
  let detail = res.statusText;
  try { detail = (await res.json()).detail || detail; } catch { /* no JSON body */ }
  if (res.status === 429 || res.status === 503) detail = 'Service is busy, retry in ' + (retry || 1) + ' s';
  throw new Error(res.status + ': ' + detail);
}

async function copyShort(l, btn) {
  try { await navigator.clipboard.writeText(l.short_url); btn.textContent = 'Copied'; }
  catch { btn.textContent = 'Failed'; }
}

function setError(text) { const e = $('err'); if (e) e.textContent = text || ''; }

async function removeLink(l) {
  try {
    await api('DELETE', '/api/v1/links/' + l.code);
    links = links.filter((x) => x.code !== l.code); save('links', links);
    return true;
  } catch (e) { setError(e.message); return false; }
}

/* ---- views ---- */

function viewShorten() {
  if (state.created) return viewCreated(state.created);
  $('main').innerHTML = `
    <form id="form" class="col" style="gap:40px" autocomplete="off">
      <div class="wrap" style="align-items:flex-end;gap:24px 40px">
        <div class="col" style="flex:1 1 520px;min-width:0;gap:12px">
          <label class="lbl" for="url">Link</label>
          <input id="url" class="big" type="url" required maxlength="2048" inputmode="url" placeholder="Paste a long link">
        </div>
        <button id="submit" class="blk" type="submit" style="margin-bottom:20px">Shorten</button>
      </div>
      <div class="wrap" style="gap:0 32px">
        <button type="button" class="tx" data-toggle="alias">+ Alias</button>
        <button type="button" class="tx" data-toggle="expiry">+ Expiry</button>
      </div>
      <div id="fields" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:40px;max-width:760px"></div>
      <p id="err" class="err" role="alert"></p>
    </form>`;
  $('url').focus();
  const opts = { alias: false, expiry: false };
  const fields = {
    alias: `<div class="col" style="gap:8px"><label class="lbl" for="alias">Alias</label>
      <input id="alias" class="sm" pattern="[A-Za-z0-9_\\-]{3,10}" maxlength="10" placeholder="3–10 characters">
      <span class="dim" style="font-size:12px">a–z &nbsp;0–9 &nbsp;_ &nbsp;-</span></div>`,
    expiry: `<div class="col" style="gap:8px"><label class="lbl" for="expires">Expires</label>
      <input id="expires" class="sm" type="datetime-local"></div>`,
  };
  document.querySelectorAll('[data-toggle]').forEach((b) => b.addEventListener('click', () => {
    const k = b.dataset.toggle; opts[k] = !opts[k];
    b.textContent = (opts[k] ? '– ' : '+ ') + (k === 'alias' ? 'Alias' : 'Expiry');
    $('fields').innerHTML = Object.keys(opts).filter((o) => opts[o]).map((o) => fields[o]).join('');
  }));
  $('form').addEventListener('submit', submitCreate);
}

async function submitCreate(ev) {
  ev.preventDefault();
  const submit = $('submit'); submit.disabled = true; setError('');
  const body = { long_url: $('url').value };
  if ($('alias') && $('alias').value) body.alias = $('alias').value;
  if ($('expires') && $('expires').value) body.expires_at = new Date($('expires').value).toISOString();
  try {
    // One key per submit: a double click or network retry cannot create two links
    const key = submit.dataset.key || (submit.dataset.key = uuid());
    const r = await api('POST', '/api/v1/links', body, { 'Idempotency-Key': key });
    links = [r, ...links.filter((x) => x.code !== r.code)]; save('links', links);
    state.created = r; route();
  } catch (e) { setError(e.message); submit.disabled = false; }
}

function viewCreated(l) {
  $('main').innerHTML = `
    <div class="col" style="gap:48px">
      <div class="col" style="gap:12px">
        <div class="lbl">Created</div>
        <div class="display"><span style="color:var(--faint)">${esc(host(l))}</span>${esc(l.code)}</div>
        <div class="dim" style="font-size:15px;overflow-wrap:anywhere">${esc(l.long_url)}</div>
      </div>
      <div class="wrap" style="gap:8px 32px">
        <button id="copy" class="blk" type="button">Copy</button>
        <a class="tx" href="#/links/${encodeURIComponent(l.code)}">Details</a>
        <button id="again" class="tx" type="button">New link</button>
      </div>
    </div>`;
  $('copy').addEventListener('click', (e) => copyShort(l, e.target));
  $('again').addEventListener('click', () => { state.created = null; route(); });
}

function viewLinks() {
  const n = String(links.length).padStart(2, '0');
  $('main').innerHTML = `
    <div class="wrap" style="align-items:baseline;gap:20px">
      <h1 class="title">Links</h1><span class="dim" style="font-size:13px">${n}</span>
    </div>
    <p id="err" class="err" role="alert"></p>
    <ul id="links"></ul>
    ${links.length ? '' : '<p class="dim" style="margin:40px 0 0;font-size:15px">Nothing here. <a href="#/" style="text-decoration:underline;text-underline-offset:4px">Shorten a link</a></p>'}`;
  const ul = $('links');
  for (const l of links) {
    const li = document.createElement('li');
    li.innerHTML = `
      <div style="flex:1 1 260px;min-width:0;font:15px var(--mono);overflow-wrap:anywhere"><span class="dim">${esc(host(l))}</span>${esc(l.code)}</div>
      <div class="col" style="flex:2 1 340px;min-width:0;gap:4px">
        <div class="dim" style="font-size:15px;overflow-wrap:anywhere">${esc(l.long_url)}</div>
        ${l.expires_at ? `<div class="dim" style="font-size:12px">Expires ${esc(fmt(l.expires_at))}</div>` : ''}
      </div>
      <div class="wrap row-actions" style="gap:4px 24px"></div>`;
    ul.append(li);
    rowIdle(li, l);
  }
}

function rowIdle(li, l) {
  const box = li.querySelector('.row-actions');
  box.innerHTML = `<button class="tx" data-a="copy" style="min-width:52px">Copy</button>
    <a class="nav tx" href="#/links/${encodeURIComponent(l.code)}" style="color:var(--dim)">Details</a>
    <button class="tx" data-a="ask">Delete</button>`;
  box.querySelector('[data-a=copy]').addEventListener('click', (e) => copyShort(l, e.target));
  box.querySelector('[data-a=ask]').addEventListener('click', () => rowConfirm(li, l));
}

function rowConfirm(li, l) {
  const box = li.querySelector('.row-actions');
  box.innerHTML = `<span class="lbl" style="font-weight:600;color:var(--fg)">Delete?</span>
    <button class="tx strong" data-a="yes">Yes</button><button class="tx" data-a="no">No</button>`;
  box.querySelector('[data-a=yes]').addEventListener('click', async () => { if (await removeLink(l)) viewLinks(); });
  box.querySelector('[data-a=no]').addEventListener('click', () => rowIdle(li, l));
}

async function viewDetail(code) {
  $('main').innerHTML = '<p class="dim">Loading…</p>';
  let r;
  try { r = await api('GET', '/api/v1/links/' + encodeURIComponent(code)); }
  catch (e) {
    $('main').innerHTML = `<div class="col" style="gap:32px"><h1 class="title">Not available.</h1>
      <p class="dim" style="margin:0">${esc(e.message)}</p><a class="tx" href="#/links">Back to links</a></div>`;
    return;
  }
  const l = links.find((x) => x.code === code) || { code, short_url: location.origin + '/' + code, long_url: r.long_url };
  const row = (k, v) => `<div class="col" style="gap:8px"><dt class="lbl">${k}</dt><dd>${esc(v)}</dd></div>`;
  $('main').innerHTML = `
    <div class="col" style="gap:80px">
      <div class="col" style="gap:8px">
        <div style="font:15px var(--mono)" class="dim">${esc(host(l))}</div>
        <h1 style="margin:0;font-size:clamp(48px,9vw,136px);font-weight:300;line-height:1;letter-spacing:-.04em;overflow-wrap:anywhere">${esc(r.code)}</h1>
      </div>
      <dl>
        <div class="col" style="grid-column:1/-1;gap:8px"><dt class="lbl">Destination</dt>
          <dd style="font-size:22px;font-weight:300;overflow-wrap:anywhere">${esc(r.long_url)}</dd></div>
        ${row('Status', 'Active')}${row('Created', fmt(r.created_at))}${row('Expires', r.expires_at ? fmt(r.expires_at) : 'Never')}
      </dl>
      <div>
        <div id="actions" class="wrap" style="gap:8px 32px;max-width:1000px;padding-top:32px;border-top:1px solid var(--row)"></div>
        <p id="err" class="err" role="alert"></p>
      </div>
    </div>`;
  detailIdle(l, r);
}

function detailIdle(l, r) {
  $('actions').innerHTML = `<button id="copy" class="blk" type="button">Copy</button>
    <a class="tx" href="${esc(l.short_url)}" target="_blank" rel="noopener">Open</a>
    <button id="ask" class="tx" type="button">Delete</button>`;
  $('copy').addEventListener('click', (e) => copyShort(l, e.target));
  $('ask').addEventListener('click', () => {
    $('actions').innerHTML = `<span class="lbl" style="font-weight:600;color:var(--fg)">Delete this link?</span>
      <button id="yes" class="tx strong">Yes</button><button id="no" class="tx">No</button>`;
    $('no').addEventListener('click', () => detailIdle(l, r));
    $('yes').addEventListener('click', async () => {
      if (!(await removeLink(l))) return;
      $('main').innerHTML = `<div class="col" style="gap:32px"><h1 class="title">Deleted.</h1><a class="tx" href="#/links">Back to links</a></div>`;
    });
  });
}

/* ---- router ---- */

function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  $('nav').textContent = 'Links' + (links.length ? ' (' + links.length + ')' : '');
  const main = $('main'); main.classList.remove('fade'); void main.offsetWidth; main.classList.add('fade');
  if (parts[0] === 'links' && parts[1]) viewDetail(decodeURIComponent(parts[1]));
  else if (parts[0] === 'links') viewLinks();
  else viewShorten();
}

$('key').value = load('api_key', '');
$('key').addEventListener('change', (e) => save('api_key', e.target.value));
window.addEventListener('hashchange', () => { state.created = null; route(); });
// The logo points at the current hash on the Created view, so hashchange does not fire
document.querySelector('.brand').addEventListener('click', () => { state.created = null; route(); });
route();
</script>
</body>
</html>
